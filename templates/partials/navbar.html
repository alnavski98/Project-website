<header class="site-header">
    <nav
        class="navbar"
        aria-label="Main navigation"
    >
        <a
            class="navbar__logo-link"
            href="{{ url_for('home') }}"
            aria-label="Go to home page"
        >
            <img
                class="navbar__logo"
                src="{{ url_for('static', filename='images/logo.jpg') }}"
                alt="Alexander Skinstad logo"
            >
        </a>

        <button
            class="navbar__toggle"
            type="button"
            aria-expanded="false"
            aria-controls="navbar-menu"
            aria-label="Open navigation menu"
        >
            <span class="navbar__toggle-line"></span>
            <span class="navbar__toggle-line"></span>
            <span class="navbar__toggle-line"></span>
        </button>

        <ul
            class="navbar__menu"
            id="navbar-menu"
        >
            <li>
                <a
                    href="{{ url_for('home') }}"
                    {% if request.endpoint == 'home' %}
                        aria-current="page"
                    {% endif %}
                >
                    Home
                </a>
            </li>

            <li>
                <a
                    href="{{ url_for('projects') }}"
                    {% if request.endpoint in [
                        'projects',
                        'project_detail'
                    ] %}
                        aria-current="page"
                    {% endif %}
                >
                    Projects
                </a>
            </li>

            <li>
                <a
                    href="{{ url_for('about') }}"
                    {% if request.endpoint == 'about' %}
                        aria-current="page"
                    {% endif %}
                >
                    About
                </a>
            </li>

            {% if session.get('admin_logged_in') %}
                <li>
                    <a
                        href="{{ url_for('admin_projects') }}"
                        {% if request.endpoint in [
                            'admin_projects',
                            'add_project',
                            'edit_project'
                        ] %}
                            aria-current="page"
                        {% endif %}
                    >
                        Manage projects
                    </a>
                </li>
            {% endif %}

            <li>
                <a
                    href="{{ url_for('contact') }}"
                    {% if request.endpoint == 'contact' %}
                        aria-current="page"
                    {% endif %}
                >
                    Contact
                </a>
            </li>

            {% if session.get('admin_logged_in') %}
                <li>
                    <form
                        class="navbar__logout-form"
                        method="post"
                        action="{{ url_for('logout') }}"
                    >
                        <button
                            class="navbar__auth-button"
                            type="submit"
                        >
                            Log out
                        </button>
                    </form>
                </li>
            {% else %}
                <li>
                    <a
                        href="{{ url_for('login') }}"
                        {% if request.endpoint == 'login' %}
                            aria-current="page"
                        {% endif %}
                    >
                        Log in
                    </a>
                </li>
            {% endif %}
        </ul>
    </nav>
</header>
